name: Release binaries

on:
  push:
    tags: [ '[0-9]*' ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm dependency cache
        uses: docker/build-push-action@v7
        with:
          context: .
          target: deps
          outputs: type=cacheonly
          cache-from: type=gha,scope=linux-deps
          cache-to: type=gha,mode=max,scope=linux-deps

      - name: Build static binary (x11)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            RUNEHELPER_LINUX_BACKEND=x11
            RUNEHELPER_COMMIT=${{ github.sha }}
          outputs: type=local,dest=out-x11
          cache-from: type=gha,scope=linux-deps

      - name: Build static binary (wayland)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            RUNEHELPER_LINUX_BACKEND=wayland
            RUNEHELPER_COMMIT=${{ github.sha }}
          outputs: type=local,dest=out-wayland
          cache-from: type=gha,scope=linux-deps

      - name: Collect binaries
        run: |
          mkdir -p dist
          install -m755 out-x11/RuneHelper dist/RuneHelper-linux-x86_64-x11
          install -m755 out-wayland/RuneHelper dist/RuneHelper-linux-x86_64-wayland

      - name: Check glibc floor
        run: |
          for binary in dist/*; do
            required=$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -n 1)
            echo "$binary requires $required"
            if [ "$(printf '%s\nGLIBC_2.35\n' "$required" | sort -V | tail -n 1)" != "GLIBC_2.35" ]; then
              echo "::error::$binary requires $required, the base image floor is GLIBC_2.35"
              exit 1
            fi
          done

      - name: Report runtime dependencies
        run: ldd dist/RuneHelper-linux-x86_64-wayland || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: runehelper-linux-x86_64-static
          path: dist/*

  windows:
    runs-on: windows-latest

    env:
      CMAKE_PRESET: windows-clang-release
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_COMMIT: ff0df973f2d8f183ee0aa076634080f4fba38538
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $env:VCPKG_COMMIT
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg-binary-cache
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.ImageVersion }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.ImageVersion }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        run: cmake --preset ${{ env.CMAKE_PRESET }}

      - name: Build
        run: cmake --build --preset ${{ env.CMAKE_PRESET }}

      - name: Collect binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\${{ env.CMAKE_PRESET }}\RuneHelper.exe" dist\RuneHelper-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: runehelper-windows-x86_64
          path: dist/*

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: runehelper-*
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Scan on VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          vt() { curl -sS -H "x-apikey: $VT_API_KEY" "$@"; }

          notes=""
          worst=0
          worst_total=0
          win_sha=""

          for file in dist/RuneHelper-windows-x86_64.exe dist/RuneHelper-linux-x86_64-x11 dist/RuneHelper-linux-x86_64-wayland; do
            [ -f "$file" ] || continue

            name=$(basename "$file")
            sha=$(sha256sum "$file" | cut -d" " -f1)
            report=$(vt "https://www.virustotal.com/api/v3/files/$sha" || true)
            stats=$(printf "%s" "$report" | jq -c ".data.attributes.last_analysis_stats // empty" 2>/dev/null || true)

            if [ -z "$stats" ]; then
              echo "$name is unknown to VirusTotal, uploading"
              id=$(vt -X POST --form "file=@$file" https://www.virustotal.com/api/v3/files | jq -r ".data.id // empty" 2>/dev/null || true)

              if [ -n "$id" ]; then
                for _ in $(seq 40); do
                  sleep 15
                  status=$(vt "https://www.virustotal.com/api/v3/analyses/$id" | jq -r ".data.attributes.status // empty" 2>/dev/null || true)
                  [ "$status" = "completed" ] && break
                done
              fi

              report=$(vt "https://www.virustotal.com/api/v3/files/$sha" || true)
              stats=$(printf "%s" "$report" | jq -c ".data.attributes.last_analysis_stats // empty" 2>/dev/null || true)
            fi

            link="https://www.virustotal.com/gui/file/$sha"

            if [ -z "$stats" ]; then
              echo "::warning title=VirusTotal::no report for $name"
              notes="$notes- $name — no report yet, $link"$'\n'
              continue
            fi

            bad=$(printf "%s" "$stats" | jq -r "(.malicious // 0) + (.suspicious // 0)")
            total=$(printf "%s" "$stats" | jq -r "[(.malicious // 0), (.suspicious // 0), (.undetected // 0), (.harmless // 0)] | add")

            echo "$name: $bad/$total  $link"

            [ "$bad" -gt "$worst" ] && worst=$bad
            [ "$total" -gt "$worst_total" ] && worst_total=$total
            [ "$name" = "RuneHelper-windows-x86_64.exe" ] && win_sha=$sha
            notes="$notes- $name — $bad/$total detections, $link"$'\n'

            if [ "$bad" -gt 0 ]; then
              flagged=$(printf "%s" "$report" | jq -r "
                .data.attributes.last_analysis_results
                | to_entries
                | map(select(.value.category == \"malicious\" or .value.category == \"suspicious\"))
                | map(.key + \": \" + (.value.result // \"?\"))
                | join(\", \")" 2>/dev/null || true)

              echo "::warning title=VirusTotal::$name flagged by $flagged"
              notes="$notes  flagged by $flagged"$'\n'
            fi
          done

          {
            echo "## VirusTotal"
            echo
            printf "%s" "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

          gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.md
          {
            echo
            echo "### VirusTotal"
            echo
            printf "%s" "$notes"
          } >> notes.md

          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

          if [ "$worst_total" -eq 0 ]; then
            exit 0
          fi

          if [ "$worst" -eq 0 ]; then
            color=brightgreen
          elif [ "$worst" -le 2 ]; then
            color=yellow
          else
            color=red
          fi

          badge=.github/badges/virustotal.json
          mkdir -p "$(dirname "$badge")"
          jq -n --arg m "$worst/$worst_total" --arg c "$color" \
            '{schemaVersion: 1, label: "virustotal", message: $m, color: $c}' > "$badge"

          if [ -n "$win_sha" ]; then
            shield=https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2FDenzeriko%2FRuneHelper%2Fmaster%2F.github%2Fbadges%2Fvirustotal.json
            line="[![VirusTotal]($shield)](https://www.virustotal.com/gui/file/$win_sha)<!-- vt-badge -->"
            awk -v line="$line" '/<!-- vt-badge -->/ { print line; next } { print }' README.md > README.new
            mv README.new README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$badge" README.md

          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi

          git commit -m "virustotal badge: $worst/$worst_total [skip ci]"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
