name: Release binaries

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Warm dependency cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deps
          outputs: type=cacheonly
          cache-from: type=gha,scope=linux-deps
          cache-to: type=gha,mode=max,scope=linux-deps

      - name: Build static binary (x11)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: RUNEHELPER_LINUX_BACKEND=x11
          outputs: type=local,dest=out-x11
          cache-from: type=gha,scope=linux-deps

      - name: Build static binary (wayland)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: RUNEHELPER_LINUX_BACKEND=wayland
          outputs: type=local,dest=out-wayland
          cache-from: type=gha,scope=linux-deps

      - name: Collect binaries
        run: |
          mkdir -p dist
          install -m755 out-x11/RuneHelper dist/RuneHelper-linux-x86_64-x11
          install -m755 out-wayland/RuneHelper dist/RuneHelper-linux-x86_64-wayland

      - name: Check glibc floor
        run: |
          for binary in dist/*; do
            required=$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -n 1)
            echo "$binary requires $required"
            if [ "$(printf '%s\nGLIBC_2.35\n' "$required" | sort -V | tail -n 1)" != "GLIBC_2.35" ]; then
              echo "::error::$binary requires $required, the base image floor is GLIBC_2.35"
              exit 1
            fi
          done

      - name: Report runtime dependencies
        run: ldd dist/RuneHelper-linux-x86_64-wayland || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runehelper-linux-x86_64-static
          path: dist/*

  windows:
    runs-on: windows-latest

    env:
      CMAKE_PRESET: windows-clang-release
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_COMMIT: ff0df973f2d8f183ee0aa076634080f4fba38538
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $env:VCPKG_COMMIT
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg-binary-cache
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        run: cmake --preset ${{ env.CMAKE_PRESET }}

      - name: Build
        run: cmake --build --preset ${{ env.CMAKE_PRESET }}

      - name: Collect binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\${{ env.CMAKE_PRESET }}\RuneHelper.exe" dist\RuneHelper-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runehelper-windows-x86_64
          path: dist/*

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
