name: Linux build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libopencv-dev \
            libtesseract-dev \
            libleptonica-dev \
            libcurl4-openssl-dev \
            libglfw3-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev

      - name: Cache CMake dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/DependenciesLinux.cmake') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
