name: Prices missing or wrong
description: RuneHelper does not read some rows, or shows a price for the wrong item
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A capture of the panel is what makes these fixable. Open the menu in the game, click **Create Bug Report** in the **Debug Menu** tab, then attach the zip it saves; **Open Folder** next to it shows where it is:

        - Windows: `%APPDATA%\Denz\RuneHelper\reports`
        - Linux: `~/.config/RuneHelper/reports`

        Older versions have only **Save OCR Debug**, which writes the files to `ocr_debug/latest` in the same place. `source.png` matters most there. Please attach it as a file rather than a screenshot of it, so no pixels change.
  - type: input
    id: version
    attributes:
      label: RuneHelper version
      description: Shown on the RuneHelper tab, next to Version.
      placeholder: 1.8.0 (abc12)
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - Linux, X11
        - Linux, Wayland (Hyprland, Sway or another wlroots compositor)
        - Linux, Wayland (KDE Plasma or GNOME)
    validations:
      required: true
  - type: input
    id: resolution
    attributes:
      label: Screen resolution
      placeholder: 1920x1080
    validations:
      required: true
  - type: input
    id: scaling
    attributes:
      label: Display scaling
      description: Windows Settings > Display > Scale, or the scale set in your compositor.
      placeholder: 150%
    validations:
      required: true
  - type: dropdown
    id: hdr
    attributes:
      label: HDR
      options:
        - "Off"
        - "On"
        - Not sure
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Game language
      placeholder: English
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong
      description: Which rows were missing, or which price belonged to another item.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Bug report
      description: Drag the zip from Create Bug Report here, or source.png, prepared.png and rows_detected.png from ocr_debug/latest.
    validations:
      required: true
